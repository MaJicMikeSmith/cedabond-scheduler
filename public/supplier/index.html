<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Portal — Cedabond Exhibition</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">Cedabond Exhibition<small>Supplier portal</small></div>
    <div>
      <button class="secondary small" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="grid-2">
      <div class="card card--pink">
        <h2>Members</h2>
        <p class="muted">Tick the members you'd like to meet, then hit Request. Max 40 active requests at a time.</p>
        <table id="membersTable">
          <thead><tr>
            <th></th>
            <th class="sortable" data-sort="name">Name</th>
            <th class="sortable" data-sort="date">Date</th>
            <th>Time</th>
            <th class="sortable" data-sort="bookings">Status</th>
          </tr></thead>
          <tbody></tbody>
        </table>
        <p class="empty" id="membersEmpty" style="display:none">No members loaded yet.</p>
        <div style="margin-top:12px; display:flex; align-items:center; gap:14px;">
          <button class="primary small" id="requestSelectedBtn" disabled>Request selected</button>
          <span id="selectionCount" class="muted"></span>
        </div>
      </div>

      <div class="card card--teal">
        <h1 id="whoami" class="supplier-name"></h1>
        <h2>My schedule</h2>
        <p class="muted">Tap an open slot to block it (e.g. for a break). Tap a blocked slot to release it again.</p>
        <div id="schedule"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/supplier.js"></script>
</body>
</html>
